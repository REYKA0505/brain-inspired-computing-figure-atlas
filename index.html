<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="从神经环路到类脑模型，积累有据可查的科研绘图参考。">
  <title>类脑计算科研图谱</title>
  <link rel="stylesheet" href="assets/gallery.css?v=5">
  <script defer src="data/figures.js?v=2"></script>
  <script defer src="assets/gallery.js?v=4"></script>
</head>
<body>
  <!-- Lucide icons, see assets/icon-licenses.txt. -->
  <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="icon-brain" viewBox="0 0 24 24">
      <path d="M12 13h4m-4 5h6a2 2 0 0 1 2 2v1M12 8h8m-8 1a4.17 4.17 0 0 1-3 4m7-5V5a2 2 0 0 1 2-2M6 18a4 4 0 0 1-2-7.465m2.004-5.41a4 4 0 0 0-2.526 5.77m2.816-4.601A3 3 0 1 1 12 5v13a4 4 0 1 1-7.967-.518"/>
      <circle cx="16" cy="13" r=".5" fill="currentColor"/><circle cx="18" cy="3" r=".5" fill="currentColor"/>
      <circle cx="20" cy="21" r=".5" fill="currentColor"/><circle cx="20" cy="8" r=".5" fill="currentColor"/>
    </symbol>
    <symbol id="icon-search" viewBox="0 0 24 24"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></symbol>
    <symbol id="icon-reset" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8M3 3v5h5"/></symbol>
    <symbol id="icon-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
    <symbol id="icon-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
    <symbol id="icon-link" viewBox="0 0 24 24"><path d="M7 7h10v10M7 17 17 7"/></symbol>
    <symbol id="icon-close" viewBox="0 0 24 24"><path d="M18 6 6 18m0-12 12 12"/></symbol>
    <symbol id="icon-sliders" viewBox="0 0 24 24">
      <path d="M21 4h-7M10 4H3m18 8h-9M8 12H3m18 8h-5m-4 0H3M14 2v4m-6 4v4m8 4v4"/>
    </symbol>
    <symbol id="icon-masonry" viewBox="0 0 24 24">
      <rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/>
      <rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>
    </symbol>
    <symbol id="icon-grid" viewBox="0 0 24 24">
      <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
      <rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/>
    </symbol>
  </svg>

  <header class="site-header">
    <div class="shell site-header-inner">
      <a class="wordmark" href="index.html" aria-label="类脑计算科研图谱首页">
        <span class="wordmark-icon"><svg class="icon" aria-hidden="true"><use href="#icon-brain"/></svg></span>
        <span>Neuro Figure Atlas</span>
      </a>
      <nav class="site-nav" aria-label="站点导航">
        <a href="index.html" aria-current="page">图库</a>
        <a href="resources.html#topics">主题图墙</a>
        <a href="resources.html">站外资源</a>
        <a class="submission-link" href="https://github.com/REYKA0505/brain-inspired-computing-figure-atlas/issues/new?template=paper-suggestion.yml" target="_blank" rel="noopener noreferrer">资源补充<svg class="icon" aria-hidden="true"><use href="#icon-link"/></svg></a>
      </nav>
    </div>
  </header>

  <main>
    <section class="masthead" aria-labelledby="atlas-title">
      <div class="shell masthead-inner">
        <div>
          <h1 id="atlas-title">类脑计算科研图谱</h1>
          <p>类脑模型、神经环路与复杂系统的论文绘图参考</p>
        </div>
        <dl class="atlas-stats">
          <div><dt>收录图例</dt><dd id="figure-count">…</dd></div>
          <div><dt>来源论文</dt><dd id="paper-count">…</dd></div>
        </dl>
      </div>
    </section>

    <section class="shell gallery" aria-labelledby="results-title">
      <div class="search-tools">
        <div class="search-field">
          <svg class="icon" aria-hidden="true"><use href="#icon-search"/></svg>
          <input id="search" type="search" aria-label="搜索图例" placeholder="搜索图件、论文、作者或 DOI" autocomplete="off">
        </div>
        <details id="figure-filters" class="filter-panel">
          <summary class="control">
            <svg class="icon" aria-hidden="true"><use href="#icon-sliders"/></svg>筛选
          </summary>
          <div class="filter-fields">
            <label>图形线索<select id="type"><option value="">全部图形</option></select></label>
            <label>论文来源<select id="journal"><option value="">全部来源</option></select></label>
          </div>
        </details>
      </div>

      <nav class="topic-nav" aria-label="研究主题">
        <div id="topic-list" class="topic-list"></div>
      </nav>

      <div class="results-bar">
        <div class="results-heading">
          <h2 id="results-title" tabindex="-1">全部图例</h2>
          <span id="results-count" role="status"></span>
        </div>
        <div class="results-tools">
          <button class="text-button" id="reset" type="button" aria-label="重置筛选" title="重置筛选" disabled>
            <svg class="icon" aria-hidden="true"><use href="#icon-reset"/></svg>
          </button>
          <label class="sort-control"><span>排序</span><select id="sort" aria-label="排序">
            <option value="curated">整理顺序</option>
            <option value="recent">较新论文</option>
            <option value="oldest">较早论文</option>
          </select></label>
          <div class="layout-switch" role="group" aria-label="图墙布局">
            <button type="button" data-layout="masonry" aria-pressed="true" aria-label="瀑布流" title="瀑布流">
              <svg class="icon" aria-hidden="true"><use href="#icon-masonry"/></svg>
            </button>
            <button type="button" data-layout="grid" aria-pressed="false" aria-label="等高网格" title="等高网格">
              <svg class="icon" aria-hidden="true"><use href="#icon-grid"/></svg>
            </button>
          </div>
        </div>
      </div>
      <div id="active-filters" class="active-filters" role="group" aria-label="已选筛选" hidden></div>

      <p class="notice" id="notice" hidden></p>
      <noscript><p class="notice">请启用 JavaScript 以浏览图例。</p></noscript>
      <div class="figure-grid" id="grid" data-layout="masonry"></div>
      <nav class="pager" id="pager" aria-label="图例分页" hidden>
        <button class="icon-button" id="previous-page" type="button" aria-label="上一页" title="上一页"><svg class="icon" aria-hidden="true"><use href="#icon-left"/></svg></button>
        <span id="page-count"></span>
        <button class="icon-button" id="next-page" type="button" aria-label="下一页" title="下一页"><svg class="icon" aria-hidden="true"><use href="#icon-right"/></svg></button>
      </nav>
    </section>
  </main>

  <footer class="site-footer">
    <div class="shell site-footer-inner">
      <p>图形类别由图注关键词识别。复用图件前，请核对原文中的单图署名和许可。</p>
      <p><time id="snapshot-date"></time><a href="data/sources.json">来源清单</a><a href="https://github.com/REYKA0505/brain-inspired-computing-figure-atlas">GitHub</a></p>
    </div>
  </footer>

  <template id="filter-chip">
    <button type="button" class="filter-chip">
      <span></span><svg class="icon" aria-hidden="true"><use href="#icon-close"/></svg>
    </button>
  </template>

  <template id="figure-card">
    <article class="figure-card">
      <button type="button" class="preview" title="放大查看">
        <span class="card-image">
          <img alt="" loading="lazy" decoding="async">
          <span class="preview-error" hidden>预览暂不可用</span>
        </span>
      </button>
      <div class="card-body">
        <div class="card-meta">
          <span class="card-topic"></span>
          <span class="card-label"></span>
        </div>
        <h3 class="card-title"></h3>
        <div class="card-footer">
          <span class="card-journal"></span>
          <a class="card-source" target="_blank" rel="noopener noreferrer">论文<svg class="icon" aria-hidden="true"><use href="#icon-link"/></svg></a>
        </div>
      </div>
    </article>
  </template>

  <dialog id="detail" aria-labelledby="detail-title">
    <div class="detail-header">
      <p id="detail-label"></p>
      <div class="detail-controls">
        <button class="icon-button" id="previous-figure" type="button" aria-label="上一张" title="上一张"><svg class="icon" aria-hidden="true"><use href="#icon-left"/></svg></button>
        <span id="detail-position" role="status"></span>
        <button class="icon-button" id="next-figure" type="button" aria-label="下一张" title="下一张"><svg class="icon" aria-hidden="true"><use href="#icon-right"/></svg></button>
      </div>
      <button class="icon-button close" id="close-detail" type="button" aria-label="关闭" title="关闭" autofocus><svg class="icon" aria-hidden="true"><use href="#icon-close"/></svg></button>
    </div>
    <div class="detail-body">
      <a id="detail-preview" class="detail-preview" target="_blank" rel="noopener noreferrer" aria-label="在新标签页打开完整预览图">
        <img id="detail-image" alt="">
        <span class="preview-error" hidden>预览暂不可用</span>
      </a>
      <div class="detail-info">
        <h2 id="detail-title"></h2>
        <p id="detail-paper" class="detail-paper"></p>
        <p id="detail-citation" class="detail-citation"></p>
        <p id="detail-team" class="detail-citation" hidden></p>
        <p id="detail-doi" class="detail-doi"><span>DOI</span><a id="detail-doi-link" target="_blank" rel="noopener noreferrer"></a></p>
        <div class="detail-links">
          <a id="paper-link" class="control primary-action" target="_blank" rel="noopener noreferrer">查看论文<svg class="icon" aria-hidden="true"><use href="#icon-link"/></svg></a>
          <a id="original-link" class="control" target="_blank" rel="noopener noreferrer"><span id="original-link-label">查看原图</span><svg class="icon" aria-hidden="true"><use href="#icon-link"/></svg></a>
        </div>
        <div id="detail-license" class="detail-license">
          <h3>许可与权利</h3>
          <p class="license-links">
            <a id="license-link" target="_blank" rel="noopener noreferrer">文章许可</a>
            <a id="license-evidence" target="_blank" rel="noopener noreferrer" hidden>许可出处</a>
          </p>
          <p id="detail-rights" class="detail-citation" hidden></p>
        </div>
        <h3 id="caption-heading" class="caption-heading">原始图注</h3>
        <p id="detail-caption" class="detail-caption"></p>
      </div>
    </div>
  </dialog>
</body>
</html>
